name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun test

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the tarball carries the installer and payload
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e "
            const fs = require('fs');
            const parsed = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/pack.json', 'utf8'));
            const pack = Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0];
            const files = new Set(pack.files.map((entry) => entry.path));
            const required = [
              'index.ts',
              'src/cli.ts',
              'skills/dependency-upgrade/SKILL.md',
              'skills/dependency-upgrade/refs/manager-matrix.md',
              'commands/upgrade-deps.md',
              'agents/upgrade-deps.md',
            ];
            const missing = required.filter((path) => !files.has(path));
            if (missing.length > 0) {
              console.error('Tarball is missing:', missing.join(', '));
              process.exit(1);
            }
            console.log('Tarball carries', files.size, 'files');
          "
